[build]
  command = "npm run build"
  publish = "dist"

# Proxy /api requests to the deployed backend during deplooy preview/live
[[redirects]]
  from = "/api/*"
  to = "https://YOUR_BACKEND_URL.onrender.com/api/:splat"
  status = 200
  force = true

# SPA fallback
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[build.environment]
  VITE_API_URL = "https://YOUR_BACKEND_URL.onrender.com/api"
